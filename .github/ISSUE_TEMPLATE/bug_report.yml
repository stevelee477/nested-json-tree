name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: VS Code version, extension version, and operating system
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sanitized sample
      description: Remove credentials, internal URLs, and personal information.
      render: json
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
