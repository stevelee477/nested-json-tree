name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test private-history audit policy
        run: bash .github/scripts/test-private-history.sh
      - name: Scan full Git history for private identifiers
        run: bash .github/scripts/check-private-history.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Test in VS Code Extension Host
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.90.0"
      - run: npm run package -- --out nested-json-tree-ci.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nested-json-tree-vsix
          path: nested-json-tree-ci.vsix
          if-no-files-found: error
          retention-days: 7
