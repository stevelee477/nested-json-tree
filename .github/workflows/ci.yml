name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test private-history audit policy
        run: bash .github/scripts/test-private-history.sh
      - name: Scan full Git history for private identifiers
        run: bash .github/scripts/check-private-history.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only jsonc-parser ships in the VSIX; gate it strictly. Dev tooling
      # (vsce's optional Azure publishing auth) is gated on critical issues.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm test
      - name: Test in VS Code Extension Host
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.90.0"
      - run: npm run package -- --out nested-json-tree-ci.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nested-json-tree-vsix
          path: nested-json-tree-ci.vsix
          if-no-files-found: error
          retention-days: 7
