name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history for private identifiers
        run: bash .github/scripts/check-private-history.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Test in VS Code Extension Host
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.90.0"
      - run: npm run package -- --out nested-json-tree-ci.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nested-json-tree-vsix
          path: nested-json-tree-ci.vsix
          if-no-files-found: error
          retention-days: 7
