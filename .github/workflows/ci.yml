name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package -- --out nested-json-tree-ci.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: nested-json-tree-vsix
          path: nested-json-tree-ci.vsix
