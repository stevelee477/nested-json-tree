name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: runs every build, test, packaging, and artifact step without
  # creating or changing a GitHub Release.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test private-history audit policy
        run: bash .github/scripts/test-private-history.sh
      - name: Scan full Git history for private identifiers
        run: bash .github/scripts/check-private-history.sh
      - name: Resolve version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must be v$version"
            exit 1
          fi
          artifact="release-assets-v$version"
          [[ "$GITHUB_EVENT_NAME" == "push" ]] || artifact="dry-run-assets-v$version-$GITHUB_RUN_ID"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only jsonc-parser ships in the VSIX; gate it strictly. Dev tooling
      # (vsce's optional Azure publishing auth) is gated on critical issues.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm test
      # Real Chrome (preinstalled on GitHub-hosted runners) under the production CSP.
      - run: npm run test:browser
      - name: Test in VS Code Extension Host
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.90.0"
      - name: Package VSIX
        run: |
          mkdir -p dist
          npm run package -- --out "dist/nested-json-tree-${{ steps.version.outputs.version }}.vsix"
          cd dist
          sha256sum *.vsix > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Exercises the artifact hand-off on dry runs with read-only permissions.
  verify-dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Verify release assets
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS.txt
          unzip -l *.vsix | grep -E "extension/out/(extension\.js|webview/main\.js|webview/tree\.css)$"

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Verify release assets
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.vsix
            dist/SHA256SUMS.txt
