name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test private-history audit policy
        run: bash .github/scripts/test-private-history.sh
      - name: Scan full Git history for private identifiers
        run: bash .github/scripts/check-private-history.sh
      - name: Verify tag matches package version
        run: node -e "const version=require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v'+version) throw new Error('Tag must be v'+version)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Test in VS Code Extension Host
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.90.0"
      - name: Package VSIX
        run: |
          mkdir -p dist
          npm run package -- --out "dist/nested-json-tree-${GITHUB_REF_NAME#v}.vsix"
          cd dist
          sha256sum *.vsix > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.vsix
            dist/SHA256SUMS.txt
